name: trackit
description: "Track personal spending, shared group expenses and workouts."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.1.3
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  intl: ^0.20.2
  sqflite_common_ffi_web: ^1.1.1
  flutter_riverpod: ^2.6.1
  fl_chart: ^1.2.0
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.0
  flutter_secure_storage: ^11.2.0
  dio: ^5.9.2
  connectivity_plus: ^7.3.2
  image_picker: ^1.1.2
  file_picker: ^13.3.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/inter/OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
