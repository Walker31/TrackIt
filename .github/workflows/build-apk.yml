name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write lets the release step create tags and releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Every APK must carry the same signature, or Android rejects it as an
      # update and the only way past is uninstalling, which deletes the
      # user's data. The keystore lives in repository secrets; without them
      # the build falls back to a throwaway debug key and says so.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No release keystore secret; this APK is signed with a one-off debug key and cannot update an existing install."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF2
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2

      # The run number is the versionCode, so each build is a newer version.
      # One APK per CPU type is about a third the size of a universal one;
      # practically every current phone takes the arm64-v8a build.
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: trackit-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30

      # Builds of main (push or manual run) are also published as a GitHub
      # Release, tagged with the pubspec version plus the run number so every
      # build gets its own release, e.g. v1.0.0-build.4.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          tag="v${version}-build.${{ github.run_number }}"
          out=build/app/outputs/flutter-apk
          # arm64 is the one to install on any recent phone; armeabi-v7a is
          # for old 32-bit devices.
          cp "$out/app-arm64-v8a-release.apk" "trackit-${tag}.apk"
          cp "$out/app-armeabi-v7a-release.apk" "trackit-${tag}-32bit.apk"
          gh release create "$tag" "trackit-${tag}.apk" "trackit-${tag}-32bit.apk" \
            --target "${{ github.sha }}" \
            --title "TrackIt ${tag}" \
            --generate-notes \
            --latest
